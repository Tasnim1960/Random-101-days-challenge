<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form enctype="multipart/form-data">

        <label for="username">username:</label>
        <input type="text" id="username" maxlength="10" minlength="6" >
        <br>
        <label for="password">password</label> 
        <input type="password" id="password" ><br>

        <label for="email">email</label> 
        <input type="email" id="email" placeholder="momo@gmail.com" ><br>

        <label for="phone">phone</label>
        <input type="tel" id="phone" placeholder="01XXXXXXXXX" pattern="01[3-9][0-9]{8}">
        <br>
        <label for="quantity">quantity</label>
        <input type="number" id="quantity" min="0" max="100">
        <br>

        <label for="title">title:  </label> 


        <label for="mr">MR.</label>
        <input type="radio" id="mr" value="mr" name="title">
        <label for="ms">Ms.</label>
        <input type="radio" id="ms" value="ms" name="title">
        <label for="phd">PhD.</label>
        <input type="radio" id="phd" value="phd" name="title"><br>

        <label for="payment">Payment</label>
            <select id="payment">
                <option value="visa">visa</option>
                <option value="giftcard">giftcard</option>
                <option value="mastercard">mastercard</option>
            </select><br>

        <label for="checkbox">Checkbox</label>
        <input type="checkbox" id="checkbox"><br>

        <label for="comment"><comment></label>
        <textarea id="comment" rows="4" cols="30"></textarea><br>

        <label for="file">File upload</label>
        <input type="file"  id="file" accept="image/png, image/jpeg, image/pcx"><br>

        <input type="reset"><br>
        <input type="submit">



    </form>
    
</body>
</html>
